services:
  monitor:
    build: .
    ports:
      - "${MONITOR_BIND:-0.0.0.0}:8082:8501"
    env_file:
      - path: .env
        required: false
    environment:
      # Windows 挂载目录收不到 inotify 事件，改用轮询才能热更新
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
    volumes:
      # 代码热更新 + risk_history.csv 持久化
      - .:/app
    restart: unless-stopped

  notifier:
    build: .
    command: ["python", "notifier.py"]
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # 与monitor共享 risk_history.csv
      - .:/app
    healthcheck:
      # 镜像自带的健康检查探测8501，此服务没有Web端口
      disable: true
    restart: unless-stopped
